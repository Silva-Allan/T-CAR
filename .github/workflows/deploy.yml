name: Deploy frontend to VPS

on:
  push:
    branches: [main]

# Dois pushes seguidos não podem migrar o banco ao mesmo tempo
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Roda ANTES do deploy do frontend: se uma migration falhar, o site
      # nunca fica com código novo apontando para um banco antigo.
      - name: Aplicar migrations do banco
        env:
          MIGRATE_SSH_KEY: ${{ secrets.MIGRATE_SSH_KEY }}
          MIGRATE_SSH_USER: ${{ secrets.MIGRATE_SSH_USER }}
          MIGRATE_PSQL_CMD: ${{ secrets.MIGRATE_PSQL_CMD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$MIGRATE_SSH_KEY" ] || [ -z "$MIGRATE_SSH_USER" ]; then
            echo "::warning::Migrations NÃO aplicadas: configure os secrets MIGRATE_SSH_KEY e MIGRATE_SSH_USER (ver docs/MIGRATIONS.md)."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$MIGRATE_SSH_KEY" > ~/.ssh/migrate_key
          chmod 600 ~/.ssh/migrate_key

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err && [ -s ~/.ssh/known_hosts ]; then
              break
            fi
            echo "ssh-keyscan falhou (tentativa $attempt/5):"
            cat /tmp/keyscan.err
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep 5
          done

          # Comando remoto que lê SQL do stdin. Se a chave tiver command="..."
          # no authorized_keys, o servidor ignora este e usa o dele.
          PSQL_CMD="${MIGRATE_PSQL_CMD:-docker exec -i supabase-db psql -U postgres -d postgres}"
          export PSQL_REMOTE="ssh -i ~/.ssh/migrate_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 $MIGRATE_SSH_USER@$VPS_HOST '$PSQL_CMD -X -q'"
          bash scripts/migrate.sh

  build-and-deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # ssh-keyscan pode falhar silenciosamente numa instabilidade
          # passageira de rede do runner — tenta algumas vezes antes de
          # desistir, em vez de derrubar o deploy inteiro por um blip.
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err && [ -s ~/.ssh/known_hosts ]; then
              break
            fi
            echo "ssh-keyscan falhou (tentativa $attempt/5):"
            cat /tmp/keyscan.err
            if [ "$attempt" = 5 ]; then
              echo "Desisti depois de 5 tentativas."
              exit 1
            fi
            sleep 5
          done

          for attempt in 1 2 3; do
            if rsync -az --delete \
              -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
              dist/ deploy@"$VPS_HOST":/; then
              exit 0
            fi
            echo "rsync falhou (tentativa $attempt/3)"
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep 5
          done
